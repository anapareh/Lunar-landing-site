[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lunarnav"
version = "0.0.1"
description = "Pipeline de datos de Lunar Landing Site Navigator: efemérides, horizontes y exportación a JSON."
requires-python = ">=3.11"
dependencies = [
    "spiceypy",
    "numpy",
    "rasterio",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jsonschema",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
